<!doctype html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>핫클립 · 피치일정표</title>
  <link rel="icon" type="image/png" href="peach_logo.png">
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;600;700;900&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="site.css?v=20261122a" />
  <style>
    .hc-main{max-width:1100px;margin:0 auto;padding:32px max(4vw,16px) 80px}
    .hc-head{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between;margin-bottom:18px}
    .hc-head h1{margin:0;font-size:30px;font-weight:900}
    .hc-head p{margin:4px 0 0;color:var(--muted);font-size:14px}
    .hc-month{display:flex;align-items:center;gap:10px}
    .hc-month h2{margin:0;min-width:130px;text-align:center;font-size:22px;font-weight:900}
    .hc-month button{border:1px solid var(--line);background:transparent;color:inherit;border-radius:12px;padding:8px 14px;font:inherit;font-weight:800;cursor:pointer}
    .hc-month button:disabled{opacity:.35;cursor:default}
    .hc-panel{padding:22px;border-radius:24px;background:color-mix(in srgb,var(--yellow) 8%,var(--cream));border:1px solid color-mix(in srgb,var(--yellow) 22%,var(--line))}
    .dark-mode .hc-panel{background:#1f2120;border-color:#352a2c}
    .hc-panel .hc-state{padding:40px 0}
    .hc-list{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:16px;margin:0;padding:0;list-style:none}
    .hc-item{display:block;width:100%;padding:0;text-align:left;font:inherit;border:1px solid var(--line);border-radius:18px;overflow:hidden;color:inherit;background:color-mix(in srgb,var(--cream) 60%,transparent);cursor:pointer;transition:transform .15s,box-shadow .15s}
    .hc-item:hover,.hc-item:focus-visible{transform:translateY(-3px);box-shadow:0 12px 28px rgba(0,0,0,.14);outline:none}
    .hc-thumb{position:relative;aspect-ratio:16/9;background:#00000018;overflow:hidden}
    .hc-thumb img{width:100%;height:100%;object-fit:cover;display:block}
    .hc-item.vertical .hc-thumb img{object-fit:contain;background:#111}
    .hc-rank{position:absolute;left:8px;top:8px;min-width:32px;padding:3px 9px;border-radius:999px;background:#000a;color:#fff;font-size:14px;font-weight:900;text-align:center}
    .hc-item.top .hc-rank{background:var(--yellow)}
    .hc-badge{position:absolute;right:8px;top:8px;padding:2px 8px;border-radius:999px;background:#000a;color:#fff;font-size:12px;font-weight:800}
    .hc-dur{position:absolute;right:8px;bottom:8px;padding:1px 6px;border-radius:6px;background:#000b;color:#fff;font-size:12px;font-weight:700}
    .hc-body{padding:12px 14px 14px}
    .hc-title{margin:0 0 8px;font-size:15px;font-weight:800;line-height:1.4;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.8em}
    .hc-meta{display:flex;flex-wrap:wrap;gap:4px 12px;color:var(--muted);font-size:13px;font-weight:700}
    .hc-meta .views{color:var(--yellow)}
    .hc-dialog{border:0;padding:0;background:transparent;max-width:min(960px,96vw);width:100%;overflow:visible}
    .hc-dialog::backdrop{background:rgba(0,0,0,.72)}
    .hc-player-shell{position:relative;background:#0e0e0e;border-radius:18px;padding:16px;color:#fff}
    .hc-player-close{position:absolute;right:10px;top:8px;border:0;background:transparent;color:#fff;font-size:30px;line-height:1;cursor:pointer}
    .hc-player-title{margin:0 40px 12px 0;font-size:17px;font-weight:800;line-height:1.4}
    .hc-frame{position:relative;width:100%;aspect-ratio:16/9;border-radius:12px;overflow:hidden;background:#000;margin:0 auto}
    .hc-frame.vertical{aspect-ratio:9/16;height:min(78vh,720px);width:auto;max-width:100%}
    .hc-frame iframe{position:absolute;inset:0;width:100%;height:100%;border:0}
    .hc-player-foot{margin-top:12px;display:flex;justify-content:space-between;align-items:center;gap:12px;font-size:14px;font-weight:700;color:#cfcfcf}
    .hc-player-foot a{color:#ff8da6}
    .hc-state{padding:60px 0;text-align:center;color:var(--muted);font-weight:700;line-height:1.7}
    .hc-links{margin-top:24px;display:flex;gap:14px;flex-wrap:wrap;font-size:14px;font-weight:700}
    .hc-links a{color:var(--yellow)}
    @media(max-width:900px){.hc-list{grid-template-columns:repeat(3,minmax(0,1fr))}}
    @media(max-width:640px){.hc-panel{padding:12px;border-radius:18px}.hc-list{grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.hc-title{font-size:14px}.hc-head h1{font-size:24px}}
  </style>
  <script>try{if(localStorage.getItem('nyacho-theme')==='dark')document.documentElement.classList.add('pre-dark')}catch(e){}</script>
</head>
<body>
  <header class="topbar">
    <a class="brand" href="index.html" aria-label="피치 일정표 홈">
      <span class="brand-logo-stack">
        <img class="brand-logo uploaded-brand-logo brand-logo-light" src="peach_logo.png" alt="피치 로고">
        <img class="brand-logo uploaded-brand-logo brand-logo-dark" src="peach_logo.png" alt="피치 로고">
      </span>
    </a>
    <nav aria-label="주요 메뉴" class="top-tabs">
      <a href="index.html#schedule">일정표</a>
      <a class="active" href="hotclip.html">핫클립</a>
    </nav>
    <div class="header-actions">
      <button class="icon-button dark-mode-btn" id="darkModeBtn" aria-label="다크모드 켜기" title="다크모드 켜기">
        <svg class="moon-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20 15.2A8.5 8.5 0 0 1 8.8 4a8.5 8.5 0 1 0 11.2 11.2Z"/></svg>
        <svg class="sun-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.93 4.93l1.42 1.42M17.65 17.65l1.42 1.42M2 12h2M20 12h2M4.93 19.07l1.42-1.42M17.65 6.35l1.42-1.42"/></svg>
      </button>
    </div>
  </header>

  <main class="hc-main">
    <div class="hc-head">
      <div><h1>🔥 핫클립</h1><p>클립 · 캐치 게시판에서 조회수가 높은 순서예요. 클릭하면 여기서 바로 재생돼요.</p></div>
      <div class="hc-month">
        <button id="hcPrev" aria-label="이전 달">‹</button>
        <h2 id="hcMonth"></h2>
        <button id="hcNext" aria-label="다음 달">›</button>
      </div>
    </div>
    <div class="hc-panel">
      <ul class="hc-list" id="hcList"></ul>
      <div class="hc-state" id="hcState">불러오는 중…</div>
    </div>
    <div class="hc-links">
      <a href="https://www.sooplive.com/station/nslah830/vod/clip" target="_blank" rel="noopener">클립 게시판 ↗</a>
      <a href="https://www.sooplive.com/station/nslah830/catch" target="_blank" rel="noopener">캐치 게시판 ↗</a>
    </div>
  </main>

  <dialog id="hcPlayer" class="hc-dialog">
    <div class="hc-player-shell">
      <button type="button" class="hc-player-close" id="hcPlayerClose" aria-label="닫기">×</button>
      <h3 class="hc-player-title" id="hcPlayerTitle"></h3>
      <div class="hc-frame" id="hcFrame"></div>
      <div class="hc-player-foot"><span id="hcPlayerMeta"></span><a id="hcPlayerLink" href="#" target="_blank" rel="noopener">SOOP에서 보기 ↗</a></div>
    </div>
  </dialog>

  <script>
  (function(){
    var darkBtn=document.getElementById('darkModeBtn');
    function setDark(v){document.body.classList.toggle('dark-mode',v);try{localStorage.setItem('nyacho-theme',v?'dark':'light')}catch(e){}darkBtn.title=v?'라이트모드 켜기':'다크모드 켜기'}
    var saved=null;try{saved=localStorage.getItem('nyacho-theme')}catch(e){}
    setDark(saved==='dark');
    darkBtn.onclick=function(){setDark(!document.body.classList.contains('dark-mode'))};

    var kst=new Date(Date.now()+9*3600*1000),nowKey=kst.toISOString().slice(0,7);
    var month=nowKey,clips=[],cache={};
    var list=document.getElementById('hcList'),state=document.getElementById('hcState');
    var title=document.getElementById('hcMonth'),prev=document.getElementById('hcPrev'),next=document.getElementById('hcNext');

    function shift(key,d){var p=key.split('-').map(Number),dt=new Date(Date.UTC(p[0],p[1]-1+d,1));return dt.toISOString().slice(0,7)}
    function fmtDur(s){if(!s)return'';var m=Math.floor(s/60),sec=s%60;return m+':'+String(sec).padStart(2,'0')}
    function fmtDate(d){return d?d.slice(0,10).replace(/-/g,'.'):''}

    var player=document.getElementById('hcPlayer'),frame=document.getElementById('hcFrame');
    function openPlayer(c){
      var vertical=c.board==='catch';
      frame.className='hc-frame'+(vertical?' vertical':'');
      var f=document.createElement('iframe');
      f.src='https://vod.sooplive.com/player/'+encodeURIComponent(c.id)+'/embed?showChat=false&autoPlay=true&mutePlay=false';
      f.allow='autoplay; fullscreen; encrypted-media';f.allowFullscreen=true;f.referrerPolicy='strict-origin-when-cross-origin';
      frame.replaceChildren(f);
      document.getElementById('hcPlayerTitle').textContent=c.title;
      document.getElementById('hcPlayerMeta').textContent=c.boardLabel+' · 조회 '+c.views.toLocaleString('ko-KR')+' · '+fmtDate(c.date);
      document.getElementById('hcPlayerLink').href=c.url;
      player.showModal();
    }
    function closePlayer(){player.close()}
    player.addEventListener('close',function(){frame.replaceChildren()});
    player.addEventListener('click',function(e){if(e.target===player)closePlayer()});
    document.getElementById('hcPlayerClose').onclick=closePlayer;

    function render(){
      var rows=clips;
      list.replaceChildren();
      rows.forEach(function(c,i){
        var li=document.createElement('li'),b=document.createElement('button');
        b.type='button';b.className='hc-item'+(i<3?' top':'')+(c.board==='catch'?' vertical':'');
        b.setAttribute('aria-label',c.title+' 재생');
        var th=document.createElement('div');th.className='hc-thumb';
        if(c.thumbnail){var img=document.createElement('img');img.src=c.thumbnail;img.alt='';img.loading='lazy';img.referrerPolicy='no-referrer';th.append(img)}
        var rank=document.createElement('span');rank.className='hc-rank';rank.textContent=(i+1)+'위';th.append(rank);
        var badge=document.createElement('span');badge.className='hc-badge';badge.textContent=c.boardLabel;th.append(badge);
        if(c.duration){var d=document.createElement('span');d.className='hc-dur';d.textContent=fmtDur(c.duration);th.append(d)}
        var body=document.createElement('div');body.className='hc-body';
        var h=document.createElement('h3');h.className='hc-title';h.textContent=c.title;
        var meta=document.createElement('div');meta.className='hc-meta';
        var v=document.createElement('span');v.className='views';v.textContent='조회 '+c.views.toLocaleString('ko-KR');meta.append(v);
        if(c.likes){var l=document.createElement('span');l.textContent='♡ '+c.likes.toLocaleString('ko-KR');meta.append(l)}
        var dt=document.createElement('span');dt.textContent=fmtDate(c.date);meta.append(dt);
        body.append(h,meta);b.append(th,body);b.onclick=function(){openPlayer(c)};li.append(b);list.append(li);
      });
      state.hidden=rows.length>0;
      if(!rows.length)state.textContent='이 달에 올라온 클립이 없어요.';
    }

    function load(){
      var p=month.split('-');title.textContent=p[0]+'년 '+Number(p[1])+'월';
      next.disabled=month>=nowKey;
      list.replaceChildren();state.hidden=false;state.textContent='불러오는 중…';
      if(cache[month]){clips=cache[month];render();return}
      var asked=month;
      fetch('/api/soop-hotclips?month='+month,{cache:'no-store'}).then(function(r){if(!r.ok)throw new Error('request failed');return r.json()}).then(function(data){
        if(asked!==month)return;
        clips=data.clips||[];
        var failed=Object.keys(data.errors||{});
        if(!clips.length&&failed.length){state.hidden=false;state.textContent='SOOP에서 클립 목록을 가져오지 못했어요. 잠시 후 다시 시도해 주세요.';return}
        cache[month]=clips;render();
        if(failed.length){state.hidden=false;state.textContent=failed.join(', ')+' 게시판은 불러오지 못했어요.'}
      }).catch(function(){if(asked!==month)return;state.hidden=false;state.textContent='클립 목록을 불러오지 못했어요. 잠시 후 다시 시도해 주세요.'});
    }

    prev.onclick=function(){month=shift(month,-1);load()};
    next.onclick=function(){if(month<nowKey){month=shift(month,1);load()}};
    load();
  })();
  </script>
</body>
</html>
